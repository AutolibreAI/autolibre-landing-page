slug: estacionamiento-medido-caba
title: "Estacionamiento medido en CABA: cómo funciona"
primaryQuery: "cómo pago el estacionamiento en Capital"
secondaryQueries:
  - "los vecinos pueden estacionar gratis"
  - "cómo funciona el estacionamiento medido en CABA"
intent: informacional
audience: "dueño de auto que estaciona en la zona tarifada de la Ciudad de Buenos Aires, viva o no dentro de ella"
jurisdiction: [caba]
angle: "Respuesta directa en dos partes: cómo se paga hoy (app Blinkay o comercios adheridos, sin parquímetros, control por lectura de patentes) y cómo estacionan gratis los residentes de la zona tarifada (hasta 300 metros de su casa, con cuatro requisitos). Sin tarifas, horarios ni mapas de zona, que la fuente no trae, y avisando que el sistema puede cambiar."

outline:
  - h2: "Cómo se paga el estacionamiento medido en la Ciudad"
    points:
      - "respuesta directa: app Blinkay (prepago o postpago) o comercios adheridos"
      - "no hay parquímetros"
      - "aplica en la zona tarifada de la Ciudad"
      - "tabla: formas de pago"
    sourceIds: [EST-01]
  - h2: "Cómo se controla: lectura de patentes"
    points:
      - "el control se hace por lectura de patentes"
      - "no afirmar montos ni tipo de sanción: la fuente no los trae"
    sourceIds: [EST-01]
  - h2: "Si vivís en la zona tarifada: estacionar gratis cerca de tu casa"
    points:
      - "registro para estacionar gratis a hasta 300 metros de tu casa"
      - "solo para quienes viven dentro de la zona tarifada"
    sourceIds: [EST-01]
  - h2: "Qué necesitás para el beneficio de residentes"
    points:
      - "DNI o servicio con domicilio en la zona"
      - "número de partida de ABL (solo viviendas)"
      - "cédula verde o azul"
      - "no tener deuda de patentes ni de infracciones"
      - "links internos: cédulas, patente y multas"
    sourceIds: [EST-01]
  - h2: "El sistema puede cambiar: la licitación de 2026"
    points:
      - "en 2026 la Ciudad licitó un nuevo sistema de estacionamiento tarifado"
      - "caveat: puede cambiar la app o las condiciones, sin confirmación oficial todavía (ver caveats)"
      - "recomendación segura: chequear el sitio oficial antes de estacionar"
    sourceIds: [EST-01]
  - h2: "Fuera de la Ciudad: depende de cada municipio"
    points:
      - "en la Provincia de Buenos Aires el estacionamiento medido depende de cada municipio"
      - "esta nota no cubre ninguno en particular"
    sourceIds: [EST-01]
  - h2: "Dónde consultar"
    points:
      - "mail oficial: estacionamientogcaba@buenosaires.gob.ar"
    sourceIds: [EST-01]
  - h2: "Preguntas frecuentes"
    sourceIds: [EST-01]
  - h2: "Fuentes oficiales"
    points:
      - "solo las URLs https del campo Fuentes de EST-01"

faq:
