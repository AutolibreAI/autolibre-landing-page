    columns: ["Forma de pago", "Cómo funciona"]
    sourceIds: [EST-01]

caveats:
  - id: EST-01
    issue: "✅ mixto: en 2026 la Ciudad licitó un nuevo sistema de estacionamiento tarifado; que cambie la app o las condiciones es 🔍"
    handling: "contar que hubo una licitación y que la app o las condiciones pueden cambiar, sin afirmar que cambiaron ni cuándo. Fechar lo vigente con 'al 28/09/2026' y recomendar chequear el sitio oficial de la Ciudad antes de estacionar."
  - id: EST-01
    issue: "la fuente no trae tarifas, horarios, límites de la zona tarifada ni el monto o tipo de sanción por no pagar"
    handling: "no dar ninguna cifra, horario, barrio ni sanción. Decir que esos datos se consultan en el sitio oficial o al mail de consultas."
  - id: EST-01
    issue: "la fuente no explica dónde ni cómo se hace el registro de residentes"
    handling: "afirmar solo que hay que registrarse y listar los requisitos; para el trámite, remitir al mail oficial de consultas."

