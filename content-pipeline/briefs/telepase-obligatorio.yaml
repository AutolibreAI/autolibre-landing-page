intent: informacional
audience: "conductor que usa las autopistas de la Ciudad o la Autopista Buenos Aires–La Plata y pasó (o puede pasar) sin TelePASE"
jurisdiction: [caba, pba]
angle: "Respuesta directa por autopista: en las de la Ciudad (AUSA) es obligatorio y sin dispositivo pagás el doble; en la Buenos Aires–La Plata (AUBASA) queda una deuda por patente a tarifa normal. Adherirse es gratis. Sin afirmar plazos ni sanciones no confirmados."

outline:
  - h2: "¿Es obligatorio el TelePASE?"
    points:
      - "respuesta directa: depende de la autopista"
      - "AUSA: obligatorio; AUBASA: deuda por tarifa normal; resto según concesionaria"
      - "tabla comparativa AUSA vs AUBASA"
    sourceIds: [TEL-01]
  - h2: "Autopistas de la Ciudad: pagás el doble de la tarifa manual"
    points:
      - "25 de Mayo, Perito Moreno, Illia y Dellepiane; obligatorio desde el 28/09/2020"
      - "sin dispositivo: el doble de la tarifa manual"
      - "caveat: plazo y forma de regularizar / consecuencias sin confirmación oficial (ver caveats)"
    sourceIds: [TEL-01]
  - h2: "Autopista Buenos Aires–La Plata: queda una deuda asociada a tu patente"
    points:
      - "deuda por la tarifa normal, sin recargo inicial"
      - "se paga en pagopatente.com.ar"
    sourceIds: [TEL-01]
  - h2: "Si todavía no ves la pasada"
    points:
      - "las pasadas pueden tardar en aparecer en los sistemas de cobro"
    sourceIds: [TEL-01]
  - h2: "Cómo adherirte a TelePASE"
