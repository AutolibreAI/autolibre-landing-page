slug: telepase-obligatorio
title: "¿Es obligatorio el TelePASE? Qué pasa si pasás sin tenerlo"
primaryQuery: "pasé por la autopista sin TelePASE, ¿qué hago?"
secondaryQueries:
  - "cuánto me cobran si paso sin TelePASE"
