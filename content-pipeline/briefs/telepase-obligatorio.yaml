caveats:
  - id: TEL-01
    issue: "✅ mixto: el plazo para regularizar una pasada sin TelePASE en AUSA y que después se labre una infracción es 🔍 (fuentes secundarias)"
    handling: "no mencionar ningún plazo, ni la web de pago de AUSA, ni infracción/evasión. Decir que no encontramos confirmación oficial de cómo ni cuándo se regulariza ni qué pasa si no se paga; lo más seguro es no dejarla pendiente y adherirse a TelePASE."
  - id: TEL-01
    issue: "AUBASA: la fuente dice 'sin recargo inicial' y no aclara qué pasa después"
    handling: "afirmar solo 'sin recargo inicial'; no afirmar ni negar recargos posteriores; recomendar pagarla cuando aparezca."

