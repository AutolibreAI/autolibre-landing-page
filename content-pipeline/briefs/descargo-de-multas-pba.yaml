    sourceIds: [MUL-04]

tables:
  - purpose: "Formas de presentar el descargo en Provincia"
    columns: ["Forma", "Cuándo", "Qué llevar o mandar"]
    sourceIds: [MUL-03]
  - purpose: "Multa de un auto que no manejabas: situación y qué hacer"
    columns: ["Situación", "Qué hacer", "Si no lo hacés"]
