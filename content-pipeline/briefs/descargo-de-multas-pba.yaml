caveats:
  - id: MUL-04
    issue: "✅ mixto: el número de la ley que respalda la presunción del titular es 🔍 (la FAQ oficial cita un número que parece error de tipeo)"
    handling: "no citar número de ley ni artículo; decir que no encontramos confirmación del número exacto de la norma y que la regla figura en las preguntas frecuentes oficiales de Seguridad Vial de la Provincia"
  - id: MUL-03
    issue: "la relación entre presentar descargo y el descuento del pago voluntario es de MUL-02 (fuera de sourceIds)"
    handling: "no afirmarla; remitir a la nota consultar-y-pagar-multas para el pago voluntario"

