caveats:
  - id: GNC-01
    issue: "✅ mixto: el cambio obligatorio de la válvula del cilindro al hacer la prueba hidráulica sale de prensa (🔍)"
    handling: "no afirmar el cambio, ni el año ni la resolución; decir que no encontramos confirmación oficial sobre cambios en la válvula y que lo más seguro es preguntarle al taller antes de la revisión quinquenal qué tiene que cambiarse y consultarlo en ENARGAS"
  - id: VTV-04
    issue: "la documentación del GNC para la VTV en PBA viene de la lista ampliada de plantas (🔍); VTV-04 no se cita"
    handling: "decir que no encontramos confirmación oficial de que la VTV bonaerense pida documentación del GNC; lo más seguro es consultar la lista oficial antes del turno. Link a la nota de VTV por el calendario."

