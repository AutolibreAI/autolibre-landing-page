outline:
  - h2: "¿Puedo seguir manejando si me retuvieron la licencia?"
    points:
      - "respuesta directa: sí, con la Boleta de Citación, máximo 30 días corridos desde el acta"
      - "pasado ese plazo la boleta ya no te habilita"
    sourceIds: [LIC-07]
  - h2: "Los dos plazos que tenés que tener en cuenta"
    points:
      - "tabla: 30 días corridos (manejar con la boleta y presentarte) y 90 días corridos (si no te presentás, se destruye la licencia y caduca la habilitación)"
      - "ambos se cuentan desde el acta / son corridos"
    sourceIds: [LIC-07]
  - h2: "Cómo recuperar la licencia retenida"
    points:
      - "lista ordenada: regularizar lo que motivó la infracción, pedir turno web en el juzgado, presentarte personalmente con DNI en el Juzgado Administrativo de Infracciones de Tránsito que corresponda"
    sourceIds: [LIC-07]
  - h2: "Qué pasa si no te presentás"
    points:
      - "90 días corridos: licencia destruida y caducidad de la habilitación"
      - "link a licencia-vencida-como-renovar y consultar-y-pagar-multas sin duplicar su contenido"
    sourceIds: [LIC-07]
  - h2: "Preguntas frecuentes"
    sourceIds: [LIC-07]
  - h2: "Fuentes oficiales"
    points:
      - "solo https://www.gba.gob.ar/seguridadvial/preguntas_frecuentes_0"

