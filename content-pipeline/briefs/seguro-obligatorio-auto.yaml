caveats:
  - id: SEG-03
    issue: "✅ confirmado pero atribuido a una fuente de divulgación (Derecho Fácil, Ministerio de Justicia), no a la norma; la entrada aclara que rige la póliza"
    handling: "atribuir explícitamente ('según el Ministerio de Justicia'), decir 'entre otros casos' y que lo que rige es tu póliza; no dar asesoramiento: ante un rechazo, abogado o productor asesor"
  - id: SEG-01
    issue: "la entrada aclara que AutoLibre no recomienda aseguradoras ni coberturas"
    handling: "disclaimer corto: no es asesoramiento legal ni de seguros; para elegir, productor asesor de seguros matriculado"
  - id: SEG-02
    issue: "el detalle del comprobante ya está en el post publicado papeles-para-circular-amba"
    handling: "mencionar los datos en una línea y linkear, sin repetir la sección"

