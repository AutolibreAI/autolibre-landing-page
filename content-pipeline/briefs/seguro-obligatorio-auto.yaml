slug: seguro-obligatorio-auto
title: "Seguro obligatorio del auto: qué cubre y qué tenés que llevar"
primaryQuery: "qué seguro tengo que tener sí o sí"
secondaryQueries:
  - "alcanza con terceros"
  - "es obligatorio el seguro contra terceros"
  - "me pueden pedir el recibo de pago del seguro"
  - "me pidieron el seguro en un control, qué muestro"
  - "me cubre si el seguro está impago"
  - "no tengo la VTV, me pueden hacer el seguro"
intent: informacional
audience: "dueño de auto o moto en AMBA que tiene que contratar, renovar o mostrar el seguro obligatorio"
jurisdiction: [nacional]
angle: "Qué seguro es obligatorio (y qué es voluntario), qué mostrar en un control, cuándo la aseguradora puede no cubrir y por qué te piden la VTV para contratarlo. Informativo, sin recomendar aseguradoras ni coberturas."

outline:
  - h2: "Qué seguro es obligatorio"
    points:
      - "respuesta directa: responsabilidad civil hacia terceros transportados y no transportados ('contra terceros')"
      - "lo tienen que tener autos, motos, acoplados y semiacoplados"
      - "aseguradora autorizada por la SSN"
      - "base legal: art. 68 Ley 24.449 y Res. SSN 534/2023 (cobertura básica de toda póliza, vigencia anual)"
    sourceIds: [SEG-01]
  - h2: "Qué es obligatorio y qué es voluntario"
    points:
      - "tabla: RC obligatoria vs. robo, incendio, daños, todo riesgo voluntarias (se agregan por endoso)"
      - "AutoLibre no recomienda aseguradoras ni coberturas: consultar a un productor asesor matriculado"
    sourceIds: [SEG-01]
  - h2: "Qué tenés que llevar del seguro"
    points:
      - "el comprobante del seguro obligatorio (la 'tarjetita'), en papel o digital"
      - "no el recibo de pago: su falta no puede usarse como incumplimiento (Disp. ANSV 70/2009 citada en Res. SSN 534/2023)"
      - "formatos digitales: credencial en Mi Argentina o PDF/imagen legible"
      - "lo que tiene que decir el comprobante: resumen corto + link al post de papeles para circular (no duplicar)"
    sourceIds: [SEG-02]
  - h2: "Cuándo la aseguradora puede no cubrirte"
    points:
      - "según Derecho Fácil (Ministerio de Justicia): seguro impago o vencido al momento del accidente, dolo o culpa grave"
      - "tampoco cubre, entre otros: conductor sin licencia, competencias de velocidad, remolque (salvo ayuda ocasional de emergencia)"
      - "lo que rige en cada caso es tu póliza; para un rechazo puntual, abogado o productor asesor"
    sourceIds: [SEG-03]
  - h2: "Por qué te piden la VTV para contratar el seguro"
    points:
      - "antes de celebrar el contrato, la aseguradora debe exigir la VTV o que el vehículo esté en condiciones reglamentarias de seguridad si no se hizo en el año previo"
      - "Res. SSN 534/2023, art. 3"
    sourceIds: [SEG-04]
  - h2: "Preguntas frecuentes"
    sourceIds: [SEG-01, SEG-02, SEG-03, SEG-04]
  - h2: "Fuentes oficiales"
    points:
      - "solo URLs https de los campos Fuentes de SEG-01..04"

