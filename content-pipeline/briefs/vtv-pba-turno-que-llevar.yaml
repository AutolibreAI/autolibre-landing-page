caveats:
  - id: VTV-04
    issue: "✅ mixto: la lista ampliada de papeles que publican las plantas es 🔍 (no oficial), igual que lo de la VTV de otra jurisdicción"
    handling: "decir que algunas plantas publican listas con más papeles, que no encontramos confirmación oficial y que lo más seguro es guiarse por la lista del sitio oficial. No nombrar ningún papel de esa lista."
  - id: VTV-05
    issue: "la fuente no dice si se puede circular durante los 60 días de un condicional"
    handling: "decir que no encontramos confirmación oficial sobre eso y que lo más seguro es reparar y volver cuanto antes. No afirmar nada."

