caveats:
  - id: LIC-06
    issue: "Contenido con caducidad; la entrada corrige una versión anterior que la extendía a más clases. La fuente no explica cómo saber si una licencia es interjurisdiccional ni cómo se cuentan los 120 días en fechas concretas."
    handling: "Citar solo lo ✅ (alcance, ventana 1/07/2026–31/10/2026, 120 días corridos, particulares excluidas, validez nacional, copia impresa). No calcular fechas de vencimiento resultantes ni mencionar clases. Decir que el anuncio no detalla cómo verificar si tu licencia es interjurisdiccional y remitir al sitio oficial."

